services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-web
    hostname: transportmanager
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?TS_AUTHKEY musí byť v .env}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: "--ssh"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: transportmanager:latest
    container_name: transportmanager
    restart: unless-stopped
    # Zdieľa sieťový stack s tailscale kontajnerom — appka je dostupná
    # len cez tailnet, nie cez LAN port hostu.
    network_mode: "service:tailscale"
    depends_on:
      - tailscale
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DISABLE_HTTPS_REDIRECT: "true"
    volumes:
      - tm-data:/app/data

volumes:
  tm-data:
  tailscale-state:
