services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: transportmanager:latest
    container_name: transportmanager
    restart: unless-stopped
    ports:
      # host:container  – appka beží na 8080 vnútri, navonok vystavená na 8080
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DISABLE_HTTPS_REDIRECT: "true"
    volumes:
      # perzistentné JSON dáta (orders/trips/customers) prežijú reštart aj redeploy
      - tm-data:/app/data

volumes:
  tm-data:
